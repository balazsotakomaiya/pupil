name: Publish

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example app-v0.0.2
        required: true
        type: string
      ref:
        description: Branch, tag, or commit SHA to build from
        required: true
        default: main
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      release_commitish: ${{ steps.commitish.outputs.release_commitish }}
      release_prerelease: ${{ steps.release_meta.outputs.release_prerelease }}
    steps:
      - name: Resolve publish target
        id: resolve
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.tag }}"
            checkout_ref="${{ inputs.ref }}"
          else
            release_tag="${GITHUB_REF_NAME}"
            checkout_ref="${GITHUB_REF}"
          fi

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout publish ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Resolve release commitish
        id: commitish
        shell: bash
        run: |
          input_ref="${{ steps.resolve.outputs.checkout_ref }}"

          if [[ "$input_ref" == refs/heads/* ]]; then
            release_commitish="${input_ref#refs/heads/}"
          elif [[ "$input_ref" == refs/tags/* ]]; then
            release_commitish="$(git rev-parse "${input_ref}^{commit}")"
          elif git show-ref --verify --quiet "refs/heads/${input_ref}"; then
            release_commitish="${input_ref}"
          elif git show-ref --verify --quiet "refs/tags/${input_ref}"; then
            release_commitish="$(git rev-parse "${input_ref}^{commit}")"
          else
            release_commitish="${input_ref}"
          fi

          echo "release_commitish=${release_commitish}" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          release_tag="${{ steps.resolve.outputs.release_tag }}"
          release_version="${release_tag#app-v}"

          if [[ "$release_version" == *-* ]]; then
            echo "release_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear existing release assets
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;

            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              const assets = release.data.assets ?? [];

              if (assets.length === 0) {
                core.info(`No existing assets found for ${tag}.`);
                return;
              }

              for (const asset of assets) {
                core.info(`Deleting existing asset ${asset.name} (${asset.id}) from ${tag}.`);
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existing release found for ${tag}.`);
                return;
              }

              throw error;
            }

  publish:
    needs: prepare
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            platform: linux
            tauri_args: --ci
          - label: Windows x64
            os: windows-latest
            platform: windows
            tauri_args: --ci
          - label: macOS Intel
            os: macos-latest
            platform: macos
            tauri_args: --ci --target x86_64-apple-darwin
          - label: macOS Apple Silicon
            os: macos-latest
            platform: macos
            tauri_args: --ci --target aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    name: Publish (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target

      - name: Cache Tauri Linux bundler tools
        if: matrix.platform == 'linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-linux-tools-v1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Prefetch Tauri Linux bundler tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.cache/tauri"

          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --output "${HOME}/.cache/tauri/AppRun-x86_64" \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64"
          chmod +x "${HOME}/.cache/tauri/AppRun-x86_64"

          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --output "${HOME}/.cache/tauri/linuxdeploy-x86_64.AppImage" \
            "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage"
          chmod +x "${HOME}/.cache/tauri/linuxdeploy-x86_64.AppImage"

          # Pinned to a commit so an unrelated upstream edit cannot break a release. Bump it deliberately:
          # scripts/patch-linuxdeploy-gtk-plugin.sh fails loudly if the plugin's shape changed.
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --output "${HOME}/.cache/tauri/linuxdeploy-plugin-gtk.sh" \
            "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/dda522bce37387f1b853d9095713bfaa924c8423/linuxdeploy-plugin-gtk.sh"
          chmod +x "${HOME}/.cache/tauri/linuxdeploy-plugin-gtk.sh"

      # The AppImage bundles an old libwayland-client that shadows the host's and breaks WebKit on
      # distros with a newer Mesa (Fedora 44). This makes it prefer the host copy and fails the
      # build if the upstream plugin changed shape. See scripts/patch-linuxdeploy-gtk-plugin.sh.
      - name: Patch the AppImage GTK hook to prefer the host libwayland-client
        if: matrix.platform == 'linux'
        shell: bash
        run: scripts/patch-linuxdeploy-gtk-plugin.sh "${HOME}/.cache/tauri/linuxdeploy-plugin-gtk.sh"

      - name: Validate release contract
        run: bun run release:check --tag "${{ needs.prepare.outputs.release_tag }}"

      # Only export Apple env vars when the secrets are actually set. An empty
      # APPLE_CERTIFICATE would make tauri-cli try to import a blank cert and fail.
      # Until the secrets exist, macOS artifacts stay unsigned (see #39).
      - name: Configure macOS signing
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail

          append_env() {
            local name="$1"
            local value="$2"
            {
              printf '%s<<PUPIL_EOF\n' "$name"
              printf '%s\n' "$value"
              printf 'PUPIL_EOF\n'
            } >> "$GITHUB_ENV"
          }

          if [[ -z "${APPLE_CERTIFICATE}" ]]; then
            echo "Apple signing secrets are not set; macOS artifacts will be unsigned."
            exit 0
          fi

          if [[ -z "${APPLE_CERTIFICATE_PASSWORD}" ]]; then
            echo "APPLE_CERTIFICATE is set but APPLE_CERTIFICATE_PASSWORD is empty." >&2
            exit 1
          fi

          append_env APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          append_env APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"

          if [[ -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            append_env APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          fi

          if [[ -n "${APPLE_API_KEY}" && -n "${APPLE_API_ISSUER}" && -n "${APPLE_API_KEY_CONTENT}" ]]; then
            key_path="${RUNNER_TEMP}/AuthKey.p8"
            umask 077
            printf '%s\n' "${APPLE_API_KEY_CONTENT}" > "${key_path}"
            append_env APPLE_API_KEY "$APPLE_API_KEY"
            append_env APPLE_API_ISSUER "$APPLE_API_ISSUER"
            append_env APPLE_API_KEY_PATH "$key_path"
            echo "macOS signing and App Store Connect API notarization credentials are configured."
          elif [[ -n "${APPLE_ID}" && -n "${APPLE_PASSWORD}" && -n "${APPLE_TEAM_ID}" ]]; then
            append_env APPLE_ID "$APPLE_ID"
            append_env APPLE_PASSWORD "$APPLE_PASSWORD"
            append_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
            echo "macOS signing and Apple ID notarization credentials are configured."
          else
            echo "Apple certificate is set, but notarization credentials are missing." >&2
            echo "Set APPLE_API_KEY, APPLE_API_ISSUER, and APPLE_API_KEY_CONTENT, or APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID." >&2
            exit 1
          fi

      - name: Publish desktop release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/app
          tagName: ${{ needs.prepare.outputs.release_tag }}
          releaseName: Pupil v__VERSION__
          releaseCommitish: ${{ needs.prepare.outputs.release_commitish }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.release_prerelease }}
          retryAttempts: 2
          uploadUpdaterJson: true
          updaterJsonPreferNsis: false
          args: ${{ matrix.tauri_args }}
