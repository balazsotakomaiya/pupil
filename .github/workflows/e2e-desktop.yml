name: Desktop E2E

# Launches the real Pupil desktop binary, clicks through the main flows, quits,
# relaunches it against the same data and kills it abruptly. See apps/app/e2e/smoke.mjs.
# Linux is driven through tauri-driver + WebKitWebDriver, Windows through WebView2's DevTools port.
#
# The `appimage` and `fedora` jobs check the packaged Linux AppImage: it borrows the host's graphics
# stack, so it has to be started on a distro newer than the one it was built on (Fedora 44).
#
# It only runs when the e2e harness or this workflow changes, or on demand, because a
# cold release build on every push would be expensive.

on:
  push:
    paths:
      - "apps/app/e2e/**"
      - "scripts/patch-linuxdeploy-gtk-plugin.sh"
      - ".github/workflows/e2e-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            platform: linux
          - label: Windows x64
            os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    name: E2E (${{ matrix.label }})
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb \
            openbox \
            dbus-x11 \
            gnome-keyring

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target
          cache-on-failure: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Cache tauri-driver
        if: matrix.platform == 'linux'
        id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver*
          key: tauri-driver-2.1.0-${{ runner.os }}

      - name: Install tauri-driver
        if: matrix.platform == 'linux' && steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Build the app
        if: matrix.platform == 'linux'
        run: bun run --cwd apps/app tauri build --no-bundle

      # The Windows build under test is the shipped app plus one extra WebView2 flag that opens the
      # DevTools port the E2E drives (see apps/app/e2e/windows-config.mjs). It is never uploaded.
      - name: Build the app (Windows, DevTools port open)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          node apps/app/e2e/windows-config.mjs "$env:RUNNER_TEMP\e2e-tauri.conf.json"
          bun run --cwd apps/app tauri build --no-bundle --config "$env:RUNNER_TEMP\e2e-tauri.conf.json"

      - name: Run E2E (Linux)
        if: matrix.platform == 'linux'
        env:
          PUPIL_BIN: ${{ github.workspace }}/apps/app/src-tauri/target/release/pupil-app
          E2E_OUT: ${{ github.workspace }}/e2e-out
          RUN_WM: openbox
          RUN_KEYRING: "1"
        run: apps/app/e2e/run-linux.sh

      # Starts the exe on its own, without any driver, so a crash at launch is told apart from an
      # automation problem, and confirms the DevTools port is open. It wipes the app data afterwards
      # so the E2E starts from a fresh profile.
      - name: Launch check (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        continue-on-error: true
        env:
          PUPIL_BIN: ${{ github.workspace }}\apps\app\src-tauri\target\release\pupil-app.exe
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          Write-Host "WebView2 runtime: $((Get-ItemProperty $key).pv)"

          function Probe($label, [switch]$Capture) {
            Write-Host "=== $label"
            $app = Start-Process $env:PUPIL_BIN -PassThru
            Start-Sleep -Seconds 14
            $app.Refresh()
            if ($app.HasExited) {
              Write-Host "APP EXITED EARLY with code $($app.ExitCode)"
            } else {
              Write-Host "APP RUNNING pid=$($app.Id) window='$($app.MainWindowTitle)' handle=$($app.MainWindowHandle)"
            }
            $webview = Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'"
            Write-Host "WebView2 processes: $(($webview | Measure-Object).Count)"
            $browser = $webview | Where-Object { $_.CommandLine -notmatch '--type=' } | Select-Object -First 1
            if ($browser) { Write-Host "WebView2 browser cmdline: $($browser.CommandLine)" }
            $ports = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
              Where-Object { $webview.ProcessId -contains $_.OwningProcess } | ForEach-Object { $_.LocalPort }
            Write-Host "ports WebView2 listens on: $($ports -join ',')"
            try {
              $version = Invoke-RestMethod http://127.0.0.1:9222/json/version
              Write-Host "DevTools on 9222: OK ($($version.Browser))"
            } catch {
              Write-Host "DevTools on 9222: unreachable"
            }
            if ($Capture) {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
              [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
              $bitmap.Save("diagnostics\launch-check.png")
              $data = "$env:APPDATA\com.pupil.desktop"
              Write-Host "--- app data: $((Get-ChildItem $data -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')"
              Write-Host "--- app log"
              Get-Content "$data\logs\*" -Tail 40 -ErrorAction SilentlyContinue
              Copy-Item "$data\logs" diagnostics\app-logs -Recurse -ErrorAction SilentlyContinue
            }
            Get-Process pupil-app, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 3
            Remove-Item -Recurse -Force "$env:APPDATA\com.pupil.desktop", "$env:LOCALAPPDATA\com.pupil.desktop" -ErrorAction SilentlyContinue
          }

          Probe 'as built' -Capture

      - name: Run E2E (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          PUPIL_BIN: ${{ github.workspace }}\apps\app\src-tauri\target\release\pupil-app.exe
          E2E_OUT: ${{ github.workspace }}\e2e-out
          E2E_BACKEND: cdp
        run: node apps/app/e2e/smoke.mjs

      - name: Collect app logs
        if: always()
        shell: bash
        run: |
          mkdir -p e2e-out/app-logs
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp -r "$APPDATA/com.pupil.desktop/logs/." e2e-out/app-logs/ 2>/dev/null || true
          fi

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.platform }}
          path: |
            e2e-out
            diagnostics
          if-no-files-found: warn

  # Builds the AppImage the way the release does (patched linuxdeploy GTK plugin), on the oldest
  # supported base, so the `fedora` job can start exactly what would ship.
  appimage:
    name: AppImage (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target
          cache-on-failure: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Only the GTK plugin needs fetching first, so it can be patched before Tauri uses it; Tauri
      # downloads the other bundler tools itself.
      - name: Fetch and patch the AppImage GTK plugin
        run: |
          mkdir -p "${HOME}/.cache/tauri"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --output "${HOME}/.cache/tauri/linuxdeploy-plugin-gtk.sh" \
            "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          chmod +x "${HOME}/.cache/tauri/linuxdeploy-plugin-gtk.sh"
          scripts/patch-linuxdeploy-gtk-plugin.sh "${HOME}/.cache/tauri/linuxdeploy-plugin-gtk.sh"

      # No signing key here, so skip the updater artifacts (they need one).
      - name: Build the AppImage
        run: bun run --cwd apps/app tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: apps/app/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 3
          if-no-files-found: error

  # Starts that AppImage on Fedora with the distro's own Mesa and Wayland libraries. Without the
  # libwayland-client patch this fails with "Could not create default EGL display" (verified against
  # the published beta.2 AppImage, which predates the fix).
  fedora:
    name: AppImage on Fedora 44
    needs: appimage
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 20

    steps:
      - name: Install git (for checkout) and a minimal desktop stack
        run: |
          dnf -y install \
            git tar gzip findutils procps-ng \
            xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon dbus-tools ImageMagick \
            mesa-dri-drivers mesa-libEGL mesa-libGL mesa-libgbm libglvnd-egl libglvnd-glx libglvnd-gles \
            libX11 libXext libXrender libXcomposite libXdamage libXfixes libXi libXcursor libXrandr libXtst libxcb \
            fontconfig dejavu-sans-fonts
          rpm -q mesa-libEGL libwayland-client 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage
          path: appimage

      - name: Launch the AppImage
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-out
        run: apps/app/e2e/appimage-launch-check.sh appimage/*.AppImage

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fedora
          path: e2e-out
          if-no-files-found: warn
