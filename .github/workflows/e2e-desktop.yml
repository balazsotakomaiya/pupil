name: Desktop E2E

# Launches the real Pupil desktop binary, clicks through the main flows, quits,
# relaunches it against the same data and kills it abruptly. See apps/app/e2e/smoke.mjs.
# Linux is driven through tauri-driver + WebKitWebDriver, Windows through WebView2's DevTools port.
#
# It only runs when the e2e harness or this workflow changes, or on demand, because a
# cold release build on every push would be expensive.

on:
  push:
    paths:
      - "apps/app/e2e/**"
      - ".github/workflows/e2e-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            platform: linux
          - label: Windows x64
            os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    name: E2E (${{ matrix.label }})
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb \
            openbox \
            dbus-x11 \
            gnome-keyring

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target
          cache-on-failure: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Cache tauri-driver
        if: matrix.platform == 'linux'
        id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver*
          key: tauri-driver-2.1.0-${{ runner.os }}

      - name: Install tauri-driver
        if: matrix.platform == 'linux' && steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Build the app
        run: bun run --cwd apps/app tauri build --no-bundle

      - name: Run E2E (Linux)
        if: matrix.platform == 'linux'
        env:
          PUPIL_BIN: ${{ github.workspace }}/apps/app/src-tauri/target/release/pupil-app
          E2E_OUT: ${{ github.workspace }}/e2e-out
          RUN_WM: openbox
          RUN_KEYRING: "1"
        run: apps/app/e2e/run-linux.sh

      # Starts the exe on its own, without the driver, so a crash at launch is told apart from a
      # WebDriver setup problem. It also wipes the app data again so the E2E starts from a fresh profile.
      - name: Launch check (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        continue-on-error: true
        env:
          PUPIL_BIN: ${{ github.workspace }}\apps\app\src-tauri\target\release\pupil-app.exe
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          Write-Host "WebView2 runtime: $((Get-ItemProperty $key).pv)"

          # WebView2 exposes a DevTools endpoint when asked; the E2E drives the window through it.
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $app = Start-Process $env:PUPIL_BIN -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) {
            Write-Host "APP EXITED EARLY with code $($app.ExitCode)"
          } else {
            Write-Host "APP RUNNING pid=$($app.Id) window='$($app.MainWindowTitle)' handle=$($app.MainWindowHandle)"
          }
          Write-Host "WebView2 processes: $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Measure-Object).Count)"
          try {
            $targets = Invoke-RestMethod http://127.0.0.1:9222/json/list
            $targets | ForEach-Object { Write-Host "DevTools target: type=$($_.type) title='$($_.title)' url=$($_.url)" }
          } catch {
            Write-Host "DevTools endpoint not reachable: $($_.Exception.Message)"
          }

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $bitmap.Save("diagnostics\launch-check.png")

          $data = "$env:APPDATA\com.pupil.desktop"
          Write-Host "--- app data"
          Get-ChildItem $data -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
          Write-Host "--- app log"
          Get-Content "$data\logs\*" -Tail 40 -ErrorAction SilentlyContinue
          Copy-Item "$data\logs" diagnostics\app-logs -Recurse -ErrorAction SilentlyContinue

          Get-Process pupil-app, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Remove-Item -Recurse -Force $data, "$env:LOCALAPPDATA\com.pupil.desktop" -ErrorAction SilentlyContinue

      - name: Run E2E (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          PUPIL_BIN: ${{ github.workspace }}\apps\app\src-tauri\target\release\pupil-app.exe
          E2E_OUT: ${{ github.workspace }}\e2e-out
          E2E_BACKEND: cdp
        run: node apps/app/e2e/smoke.mjs

      - name: Collect app logs
        if: always()
        shell: bash
        run: |
          mkdir -p e2e-out/app-logs
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp -r "$APPDATA/com.pupil.desktop/logs/." e2e-out/app-logs/ 2>/dev/null || true
          fi

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.platform }}
          path: |
            e2e-out
            diagnostics
          if-no-files-found: warn
